<!doctype html>
<html
  lang="ro"
  data-composition-variables='[
    {"id":"signature","type":"string","label":"Semnătură","default":"by Ioana","maxLength":24},
    {"id":"ground","type":"color","label":"Fundal","default":"#0b0709"},
    {"id":"ground-glow","type":"color","label":"Lumină fundal","default":"#22171a"},
    {"id":"signature-color","type":"color","label":"Culoare semnătură","default":"#c9a36e"}
  ]'
>
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=1920, height=1080" />
    <script src="vendor/gsap.min.js"></script>
    <style>
      @font-face {
        font-family: "Figtree";
        src: url("assets/fonts/figtree-latin-500-normal.woff2") format("woff2");
        font-weight: 500;
      }
      @font-face {
        font-family: "Pinyon Script";
        src: url("assets/fonts/pinyon-script-latin-400-normal.woff2") format("woff2");
      }
      /*
       * IO Signature 3D — I-ul și O-ul din aur masiv. Inelul O coboară pe I
       * ca un inel pe deget, se rotește, se înclină și se așază în poziția din logo.
       */
      :root {
        --ground: #0b0709;
        --ground-glow: #22171a;
        --signature-color: #c9a36e;
        --font-label: "Figtree", sans-serif;
        --font-script: "Pinyon Script", cursive;
      }
      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
      }
      html,
      body {
        width: 1920px;
        height: 1080px;
        overflow: hidden;
        background: var(--ground);
      }
      #root {
        position: relative;
        width: 1920px;
        height: 1080px;
        overflow: hidden;
        background: var(--ground);
      }
      .full {
        position: absolute;
        inset: 0;
      }
      #ground {
        background: radial-gradient(56% 62% at 50% 44%, var(--ground-glow), var(--ground) 72%);
      }
      #halo {
        position: absolute;
        left: 960px;
        top: 540px;
        width: 1100px;
        height: 1100px;
        margin: -550px 0 0 -550px;
        border-radius: 50%;
        background: radial-gradient(closest-side, rgba(233, 196, 143, 0.2), rgba(201, 163, 110, 0.07) 45%, transparent 72%);
        mix-blend-mode: screen;
        opacity: 0;
      }
      #gl {
        position: absolute;
        inset: 0;
        width: 1920px;
        height: 1080px;
      }
      #lockup {
        position: absolute;
        left: 0;
        width: 1920px;
        top: 742px;
        text-align: center;
      }
      #word {
        display: inline-block;
        font: 500 36px/1 var(--font-label);
        letter-spacing: 0.72em;
        padding-left: 0.72em;
        white-space: nowrap;
      }
      #word span {
        display: inline-block;
        color: transparent;
        background: linear-gradient(100deg, #7a5634 0%, #a27a4d 26%, #f3dcae 44%, #ad8152 58%, #8a643d 78%, #7a5634 100%);
        background-size: 700px 100%;
        -webkit-background-clip: text;
        background-clip: text;
        opacity: 0;
      }
      #sigRow {
        display: flex;
        align-items: center;
        justify-content: center;
        gap: 34px;
        margin-top: 30px;
      }
      .rule {
        width: 190px;
        height: 1px;
        background: linear-gradient(90deg, transparent, rgba(201, 163, 110, 0.85));
      }
      #ruleR {
        background: linear-gradient(270deg, transparent, rgba(201, 163, 110, 0.85));
        transform-origin: 0% 50%;
      }
      #ruleL {
        transform-origin: 100% 50%;
      }
      #sig {
        font: 400 66px/1.1 var(--font-script);
        color: var(--signature-color);
        padding: 0 6px 10px;
        opacity: 0;
      }
      #vignette {
        background: radial-gradient(120% 95% at 50% 46%, transparent 55%, rgba(0, 0, 0, 0.55));
        pointer-events: none;
      }
      #grain {
        opacity: 0.06;
        mix-blend-mode: overlay;
        pointer-events: none;
      }
    </style>
  </head>
  <body>
    <div id="root" data-composition-id="main" data-start="0" data-duration="14" data-width="1920" data-height="1080">
      <div id="ground" class="full clip" data-start="0" data-duration="14" data-track-index="0"></div>
      <div id="haloClip" class="full clip" data-start="0" data-duration="14" data-track-index="1"><div id="halo"></div></div>
      <div id="glClip" class="full clip" data-start="0" data-duration="14" data-track-index="2" data-layout-ignore>
        <canvas id="gl" width="1920" height="1080" aria-label="IO Atelier monogram 3D"></canvas>
      </div>
      <div id="lockupClip" class="full clip" data-start="0" data-duration="14" data-track-index="3">
        <div id="lockup">
          <div id="word"><span>A</span><span>T</span><span>E</span><span>L</span><span>I</span><span>E</span><span>R</span></div>
          <div id="sigRow">
            <div class="rule" id="ruleL"></div>
            <div id="sig" data-var-text="signature">by Ioana</div>
            <div class="rule" id="ruleR"></div>
          </div>
        </div>
      </div>
      <div id="vignette" class="full clip" data-start="0" data-duration="14" data-track-index="4"></div>
      <svg id="grain" class="full clip" data-start="0" data-duration="14" data-track-index="5" viewBox="0 0 1920 1080" data-layout-ignore>
        <filter id="grainF"><feTurbulence type="fractalNoise" baseFrequency="0.9" numOctaves="2" seed="11" /><feColorMatrix type="saturate" values="0" /></filter>
        <rect width="1920" height="1080" filter="url(#grainF)" />
      </svg>
    </div>

    <script>
      // Tipografia și haloul: GSAP. Monograma 3D se desenează separat, din timpul fiecărui cadru.
      const tl = gsap.timeline({ paused: true });
      tl.fromTo("#halo", { opacity: 0, scale: 0.75 }, { opacity: 1, scale: 1, duration: 1.4, ease: "power3.out" }, 7.4);
      tl.to("#halo", { opacity: 0.55, y: -92, duration: 1.2, ease: "power3.inOut" }, 8.8);
      tl.fromTo(
        "#word span",
        { opacity: 0, filter: "blur(8px)" },
        { opacity: 1, filter: "blur(0px)", duration: 0.55, ease: "power3.out", stagger: 0.085 },
        9.3,
      );
      tl.fromTo("#word span", { backgroundPosition: "-260px 0" }, { backgroundPosition: "120px 0", duration: 2.4, ease: "power2.inOut" }, 9.5);
      tl.fromTo(["#ruleL", "#ruleR"], { scaleX: 0 }, { scaleX: 1, duration: 0.8, ease: "expo.out" }, 10.15);
      tl.fromTo("#sig", { opacity: 0, filter: "blur(10px)" }, { opacity: 1, filter: "blur(0px)", duration: 0.7, ease: "power3.out" }, 10.3);
      tl.set({}, {}, 14);
      window.__timelines["main"] = tl;
    </script>

    <script type="module">
      import * as THREE from "./vendor/three.module.min.js";

      window.__hf = window.__hf || {};
      window.__hf.buildReady = window.__hf.buildReady || {};

      const W = 1920;
      const H = 1080;
      const FPS = 30;
      const SUB = 8; // sub-cadre pentru motion blur real (obturator 180°)
      const SHUTTER = 0.5 / FPS;
      const DEG = Math.PI / 180;

      const canvas = document.getElementById("gl");
      const renderer = new THREE.WebGLRenderer({ canvas, antialias: false, alpha: true, preserveDrawingBuffer: true });
      renderer.setPixelRatio(1);
      renderer.setSize(W, H, false);
      renderer.toneMapping = THREE.ACESFilmicToneMapping;
      renderer.toneMappingExposure = 1.0;
      renderer.shadowMap.enabled = true;
      renderer.shadowMap.type = THREE.PCFSoftShadowMap;
      renderer.setClearColor(0x000000, 0);
      renderer.autoClear = false; // golim manual; altfel fiecare sub-cadru ar șterge acumularea

      // ——— Cameră: obiectiv lung, ca la fotografia de bijuterii ———
      // 1 unitate = 1 unitate din desenul original al monogramei (400×320); cadrul are ~415 unități înălțime.
      const camera = new THREE.PerspectiveCamera(20, W / H, 100, 4000);
      const CAM_DIST = (415 / 2) / Math.tan(10 * DEG);
      camera.position.set(0, 0, CAM_DIST);

      const scene = new THREE.Scene();

      // ——— Mediu: cameră întunecată cu trei softbox-uri; rotim mediul, nu obiectul ———
      function buildEnvironment() {
        const env = new THREE.Scene();
        const room = new THREE.Mesh(new THREE.SphereGeometry(50, 32, 16), new THREE.MeshBasicMaterial({ color: 0x050304, side: THREE.BackSide }));
        env.add(room);
        const panel = (w, h, color, intensity, pos, look) => {
          const m = new THREE.Mesh(new THREE.PlaneGeometry(w, h), new THREE.MeshBasicMaterial({ color: new THREE.Color(color).multiplyScalar(intensity), side: THREE.DoubleSide }));
          m.position.set(...pos);
          m.lookAt(...look);
          env.add(m);
        };
        panel(44, 7, 0xffffff, 6.0, [0, 32, 8], [0, 0, 0]);     // banda de sus
        panel(6, 36, 0xfff4e6, 5.0, [-33, 4, 16], [0, 0, 0]);   // fâșia din stânga
        panel(5, 32, 0xffffff, 3.0, [34, 0, -12], [0, 0, 0]);   // contur din dreapta-spate
        panel(26, 4, 0xfff0dc, 1.4, [0, -28, 20], [0, 0, 0]);   // reflexie de jos
        // softbox-ul din față, în spatele camerei: gradient de sus în jos pe fețele plate
        panel(40, 9, 0xffffff, 2.6, [0, 13, 40], [0, 0, 0]);
        panel(40, 6, 0xffffff, 1.1, [0, 4, 42], [0, 0, 0]);
        panel(40, 8, 0xffffff, 0.25, [0, -5, 42], [0, 0, 0]);
        const pmrem = new THREE.PMREMGenerator(renderer);
        const tex = pmrem.fromScene(env, 0.02).texture;
        pmrem.dispose();
        return tex;
      }
      scene.environment = buildEnvironment();
      scene.environmentIntensity = 1.0;

      // ——— Lumini cu umbre: inelul își aruncă umbra pe I când trece prin el ———
      const key = new THREE.DirectionalLight(0xfff0dc, 1.2);
      key.position.set(-160, 980, 380);
      key.castShadow = true;
      key.shadow.mapSize.set(4096, 4096);
      Object.assign(key.shadow.camera, { left: -260, right: 260, top: 400, bottom: -260, near: 100, far: 1800 });
      key.shadow.bias = -0.0008;
      key.shadow.normalBias = 1.4;
      scene.add(key);
      const rim = new THREE.DirectionalLight(0xe9dcff, 0.7);
      rim.position.set(380, 160, -500);
      scene.add(rim);

      // ——— Material: aur galben 18k, ușor periat ———
      const gold = new THREE.MeshPhysicalMaterial({
        color: 0xf3c886,
        metalness: 1,
        roughness: 0.2,
      });

      // ——— Geometrie: bare de aur cu secțiune bombată (super-elipsă), pe proporțiile exacte din logo ———
      // sweep: o curbă în planul xy, cu lățime și adâncime variabile; capetele se rotunjesc singure.
      function sweep(N, M, at, closed) {
        const pos = [];
        const idx = [];
        const n = 2.8; // exponentul super-elipsei: margini rotunjite, față aproape plată
        const sp = (v) => Math.sign(v) * Math.pow(Math.abs(v), 2 / n);
        const rows = closed ? N : N + 1;
        for (let i = 0; i < rows; i++) {
          const u = i / N;
          const { c, r, w, d } = at(u); // centru, direcția lățimii (în plan), lățime, adâncime
          for (let j = 0; j < M; j++) {
            const ph = (j / M) * Math.PI * 2;
            const a = sp(Math.cos(ph)) * w / 2;
            const b = sp(Math.sin(ph)) * d / 2;
            pos.push(c.x + r.x * a, c.y + r.y * a, b);
          }
        }
        for (let i = 0; i < N; i++) {
          const i2 = closed ? (i + 1) % N : i + 1;
          for (let j = 0; j < M; j++) {
            const j2 = (j + 1) % M;
            const A = i * M + j, B = i2 * M + j, Cc = i2 * M + j2, D = i * M + j2;
            idx.push(A, B, D, B, Cc, D);
          }
        }
        const g = new THREE.BufferGeometry();
        g.setAttribute("position", new THREE.Float32BufferAttribute(pos, 3));
        g.setIndex(idx);
        g.computeVertexNormals();
        return g;
      }
      // capăt rotunjit: lățimea și adâncimea scad elipsoidal pe ultimii `e` din lungime
      const capScale = (s, L, e) => {
        const k = Math.min(s, L - s);
        return k >= e ? 1 : Math.sqrt(Math.max(0, 1 - Math.pow(1 - k / e, 2)));
      };
      function bar(x0, y0, x1, y1, w, d) {
        const L = Math.hypot(x1 - x0, y1 - y0);
        const r = new THREE.Vector2(-(y1 - y0) / L, (x1 - x0) / L);
        return sweep(64, 48, (u) => {
          const k = capScale(u * L, L, Math.min(w, d) * 0.5);
          return { c: new THREE.Vector2(x0 + (x1 - x0) * u, y0 + (y1 - y0) * u), r, w: w * k + 0.0001, d: d * k + 0.0001 };
        }, false);
      }
      // I: tija (17 lățime) și serifele (48 × 6), coordonate centrate, y în sus
      const stemGeos = [bar(0, -83, 0, 83, 17, 9), bar(-24, 83, 24, 83, 7.4, 10.6), bar(-24, -83, 24, -83, 7.4, 10.6)];
      // O: centrul și grosimea urmează exact inelul din logo (exterior r58, interior elipsă 50×54)
      const ringGeo = sweep(360, 48, (u) => {
        const th = u * Math.PI * 2;
        const ct = Math.cos(th), st = Math.sin(th);
        const inner = 1 / Math.sqrt((ct * ct) / (50 * 50) + (st * st) / (54 * 54));
        const mid = (58 + inner) / 2;
        return { c: new THREE.Vector2(ct * mid, st * mid), r: new THREE.Vector2(ct, st), w: 58 - inner, d: 6.5 };
      }, true);
      const stem = new THREE.Group();
      for (const g of stemGeos) stem.add(new THREE.Mesh(g, gold));
      const ring = new THREE.Mesh(ringGeo, gold);
      stem.traverse((m) => { if (m.isMesh) { m.castShadow = true; m.receiveShadow = true; } });
      ring.castShadow = true;
      ring.receiveShadow = true;

      const mark = new THREE.Group();   // tot semnul, pentru urcarea finală
      const ringPivot = new THREE.Group();
      ringPivot.add(ring);
      mark.add(stem, ringPivot);
      scene.add(mark);

      // ——— Suprafața neagră lucioasă pe care stă I-ul ———
      const FLOOR_Y = -86.8; // baza serifei de jos
      const shadowFloor = new THREE.Mesh(new THREE.PlaneGeometry(900, 700), new THREE.ShadowMaterial({ opacity: 0.55 }));
      shadowFloor.rotation.x = -Math.PI / 2;
      shadowFloor.position.y = FLOOR_Y;
      shadowFloor.receiveShadow = true;
      mark.add(shadowFloor);

      // reflexia: o copie oglindită a semnului, care se stinge pe măsură ce coboară sub suprafață
      const reflUniforms = { uFloorY: { value: FLOOR_Y }, uFade: { value: 1 } };
      const reflGold = gold.clone();
      reflGold.side = THREE.DoubleSide;
      reflGold.transparent = true;
      reflGold.depthWrite = false;
      reflGold.onBeforeCompile = (sh) => {
        sh.uniforms.uFloorY = reflUniforms.uFloorY;
        sh.uniforms.uFade = reflUniforms.uFade;
        sh.vertexShader = "varying float vWorldY;\n" + sh.vertexShader.replace(
          "#include <project_vertex>",
          "#include <project_vertex>\n vWorldY = (modelMatrix * vec4(transformed, 1.0)).y;");
        sh.fragmentShader = "uniform float uFloorY; uniform float uFade; varying float vWorldY;\n" + sh.fragmentShader.replace(
          "#include <dithering_fragment>",
          "#include <dithering_fragment>\n gl_FragColor.a *= uFade * 0.34 * exp(-max(uFloorY - vWorldY, 0.0) / 26.0);");
      };
      const mirror = new THREE.Group();
      mirror.position.y = 2 * FLOOR_Y;
      mirror.scale.y = -1;
      for (const g of stemGeos) mirror.add(new THREE.Mesh(g, reflGold));
      const mirrorRingPivot = new THREE.Group();
      mirrorRingPivot.add(new THREE.Mesh(ringGeo, reflGold));
      mirror.add(mirrorRingPivot);
      mirror.renderOrder = -1;
      mark.add(mirror);

      // ——— Mișcarea: funcții pure de timp ———
      const clamp01 = (x) => Math.min(1, Math.max(0, x));
      const smooth = (x) => x * x * (3 - 2 * x);
      const easeOutCubic = (x) => 1 - Math.pow(1 - x, 3);
      const easeOutQuint = (x) => 1 - Math.pow(1 - x, 5);
      const easeInOut = (x) => (x < 0.5 ? 4 * x * x * x : 1 - Math.pow(-2 * x + 2, 3) / 2);

      const TILT_END = -14 * DEG; // bucla de jos în fața I-ului, cea de sus în spate — exact ca în logo
      const qY = new THREE.Quaternion();
      const qX = new THREE.Quaternion();
      const qW = new THREE.Quaternion();
      const AX_Y = new THREE.Vector3(0, 1, 0);
      const AX_X = new THREE.Vector3(1, 0, 0);
      const wobbleAxis = new THREE.Vector3();
      const sine = (x) => 0.5 - 0.5 * Math.cos(Math.PI * x);

      // ——— Căderea: gravitație constantă, două sărituri cu restituție 0.28, apoi repaus ———
      const T_DROP = 1.0;
      const Y0 = 330;                       // deasupra cadrului
      const Y_REST = FLOOR_Y + 3.25;        // inel orizontal culcat pe suprafață
      const T_FALL = 1.05;
      const G = (2 * (Y0 - Y_REST)) / (T_FALL * T_FALL);
      const T_HIT = T_DROP + T_FALL;
      const E = 0.28;
      const V1 = G * T_FALL * E;
      const B1 = (2 * V1) / G;
      const V2 = V1 * E;
      const B2 = (2 * V2) / G;
      function dropHeight(t) {
        if (t < T_DROP) return Y0;
        if (t < T_HIT) { const k = t - T_DROP; return Y0 - 0.5 * G * k * k; }
        let k = t - T_HIT;
        if (k < B1) return Y_REST + V1 * k - 0.5 * G * k * k;
        k -= B1;
        if (k < B2) return Y_REST + V2 * k - 0.5 * G * k * k;
        return Y_REST;
      }

      // ——— Ridicarea lentă: o spirală de 1½ ture pe I, din orizontal în vertical ———
      const T_RISE = 3.7;
      const T_PLACE = 7.9;

      function pose(t) {
        // 1 · I-ul iese din întuneric: lumina se ridică, reflexiile alunecă pe metal
        const reveal = smooth(clamp01((t - 0.1) / 1.6));
        renderer.toneMappingExposure = 0.15 + 0.95 * reveal;
        scene.environmentRotation.set(0, -0.9 + 1.3 * easeInOut(clamp01(t / 10)) + 0.2 * smooth(clamp01((t - 10) / 4)), 0);

        // 2 · căderea și oscilația pe margine (ca o monedă care se liniștește)
        let y = dropHeight(t);
        let delta = 2.5 * DEG;                              // mică înclinare în cădere
        let phi = 0.6 + 1.4 * Math.max(0, t - T_DROP);      // direcția înclinării
        if (t >= T_HIT) {
          const k = t - T_HIT;
          delta = 6.5 * DEG * Math.exp(-k / 0.62);
          phi = 0.6 + 1.4 * T_FALL + 5 * k + 7.5 * k * k;   // precesia se accelerează pe măsură ce se culcă
        }

        // 3 · ridicarea senzuală: lentă la plecare, lentă la sosire
        const v = clamp01((t - T_RISE) / (T_PLACE - T_RISE));
        const e = sine(v);
        delta *= 1 - smooth(clamp01(v / 0.25));
        y += (0 - Y_REST) * e;
        let beta = 90 * DEG + (-TILT_END - 90 * DEG) * sine(clamp01((v - 0.08) / 0.92));
        // inelul nu intră niciodată în suprafață sau în serifa de sus
        const low = Math.acos(Math.min(1, Math.max(-1, (y - Y_REST) / 58)));
        const high = Math.acos(Math.min(1, Math.max(-1, (75 - y) / 58)));
        beta = Math.max(beta, low);
        // limita serifei de sus contează doar cât timp inelul e sub ea
        if (y < 75 && y + 58 * Math.cos(beta) > 75) beta = Math.max(beta, Math.min(high, 90 * DEG));
        let spin = -1.5 * Math.PI * 2 * (1 - e);
        let tilt = -beta;

        // 4 · intrarea în poziție: o legănare fină, amortizată
        const s = t - T_PLACE;
        if (s > 0) {
          const env = Math.exp(-2.6 * s);
          tilt += 2.2 * DEG * env * Math.sin(5.5 * s);
          spin += 1.4 * DEG * env * Math.sin(4.2 * s + 0.4);
        }

        // ridicarea inelului de pe suprafață prin înclinare: marginea atinge, centrul urcă
        y += 58 * Math.sin(delta) * (t >= T_HIT ? 1 : 0);

        wobbleAxis.set(Math.cos(phi), 0, Math.sin(phi));
        qW.setFromAxisAngle(wobbleAxis, delta);
        qY.setFromAxisAngle(AX_Y, spin);
        qX.setFromAxisAngle(AX_X, tilt);
        ringPivot.quaternion.copy(qW).multiply(qY).multiply(qX);
        ringPivot.position.set(0, y, 0);
        mirrorRingPivot.quaternion.copy(ringPivot.quaternion);
        mirrorRingPivot.position.copy(ringPivot.position);

        // 5 · semnul urcă pentru tipografie; suprafața și reflexia se sting
        const lift = easeInOut(clamp01((t - 8.8) / 1.2));
        mark.position.y = 92 * 0.385 * lift; // 92 px în unități de scenă
        const floorFade = 1 - smooth(clamp01((t - 8.4) / 1.2));
        reflUniforms.uFade.value = floorFade;
        reflUniforms.uFloorY.value = mark.position.y + FLOOR_Y;
        shadowFloor.material.opacity = 0.55 * floorFade;

        // camera: puțin de sus la început (se vede suprafața), frontală la final
        const level = sine(clamp01((t - 3.4) / 5.2));
        const elev = (7 - 7 * level) * DEG;
        const dist = CAM_DIST * (1.1 - 0.1 * easeOutCubic(clamp01(t / 8)));
        camera.position.set(0, dist * Math.sin(elev), dist * Math.cos(elev));
        camera.lookAt(0, -14 * (1 - level), 0);
      }

      // ——— Motion blur prin acumulare de sub-cadre (HDR, apoi tonemapping) ———
      const rtOpts = { type: THREE.HalfFloatType, colorSpace: THREE.LinearSRGBColorSpace };
      const sceneRT = new THREE.WebGLRenderTarget(W, H, { ...rtOpts, samples: 4 });
      const accumRT = new THREE.WebGLRenderTarget(W, H, rtOpts);
      const quadCam = new THREE.OrthographicCamera(-1, 1, 1, -1, 0, 1);
      const quadGeo = new THREE.PlaneGeometry(2, 2);
      const addMat = new THREE.ShaderMaterial({
        uniforms: { tSrc: { value: sceneRT.texture }, w: { value: 1 / SUB } },
        vertexShader: "varying vec2 vUv; void main(){ vUv = uv; gl_Position = vec4(position.xy, 0.0, 1.0); }",
        fragmentShader: "uniform sampler2D tSrc; uniform float w; varying vec2 vUv; void main(){ gl_FragColor = texture2D(tSrc, vUv) * w; }",
        blending: THREE.AdditiveBlending, premultipliedAlpha: true, depthTest: false, depthWrite: false, transparent: true, toneMapped: false,
      });
      const outMat = new THREE.ShaderMaterial({
        uniforms: { tSrc: { value: accumRT.texture } },
        vertexShader: "varying vec2 vUv; void main(){ vUv = uv; gl_Position = vec4(position.xy, 0.0, 1.0); }",
        fragmentShader: `uniform sampler2D tSrc; varying vec2 vUv;
          void main(){
            vec4 c = texture2D(tSrc, vUv);
            vec3 rgb = c.a > 0.0001 ? c.rgb / c.a : vec3(0.0);
            gl_FragColor = vec4(max(rgb, 0.0), clamp(c.a, 0.0, 1.0));
            #include <tonemapping_fragment>
            #include <colorspace_fragment>
            gl_FragColor.rgb *= gl_FragColor.a;
          }`,
        depthTest: false, depthWrite: false, toneMapped: true, premultipliedAlpha: true,
      });
      const addScene = new THREE.Scene();
      addScene.add(new THREE.Mesh(quadGeo, addMat));
      const outScene = new THREE.Scene();
      outScene.add(new THREE.Mesh(quadGeo, outMat));

      function renderAt(t) {
        renderer.setRenderTarget(accumRT);
        renderer.setClearColor(0x000000, 0);
        renderer.clear();
        for (let i = 0; i < SUB; i++) {
          const ts = Math.max(0, t - SHUTTER * (i / (SUB - 1)));
          pose(ts);
          renderer.setRenderTarget(sceneRT);
          renderer.setClearColor(0x000000, 0);
          renderer.clear();
          renderer.render(scene, camera);
          renderer.setRenderTarget(accumRT);
          renderer.render(addScene, quadCam);
        }
        pose(t); // expunerea finală corespunde timpului cadrului
        renderer.setRenderTarget(null);
        renderer.clear();
        renderer.render(outScene, quadCam);
      }

      // Compilăm shaderele o dată, înainte de primul cadru.
      window.__hf.buildReady["io3d"] = (async () => {
        renderer.compile(scene, camera);
        renderAt(0);
      })();

      window.addEventListener("hf-seek", (e) => renderAt(e.detail.time));
    </script>
  </body>
</html>
